<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modals • adminHMD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="page">
  <div class="page-head"><div class="icon"><i class="bi bi-window-stack"></i></div>
    <div><div class="eyebrow">DIALOGS</div><h1>Modals</h1><p>Basic, form and confirmation modals.</p></div>
  </div>
  <div class="card-x">
    <button class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#m1">Basic Modal</button>
    <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#m2">Form Modal</button>
    <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#m3">Confirm Delete</button>
  </div>
</div>
<div class="modal fade" id="m1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Welcome</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">This is a simple modal example.</div><div class="modal-footer"><button class="btn btn-light border" data-bs-dismiss="modal">Close</button></div></div></div></div>
<div class="modal fade" id="m2"><div class="modal-dialog"><div class="modal-content"><form onsubmit="event.preventDefault();bootstrap.Modal.getInstance(document.getElementById('m2')).hide();alert('Saved!')"><div class="modal-header"><h5 class="modal-title">Quick Edit</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Name</label><input class="form-control mb-2" required><label class="form-label">Email</label><input type="email" class="form-control" required></div><div class="modal-footer"><button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save</button></div></form></div></div></div>
<div class="modal fade" id="m3"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title text-danger">Delete Item?</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">This action cannot be undone.</div><div class="modal-footer"><button class="btn btn-light border" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" data-bs-dismiss="modal" onclick="alert('Deleted')">Delete</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script><script>renderLayout('modals.html');</script>
</body></html>

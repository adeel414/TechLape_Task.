<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forms • adminHMD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="page">
  <div class="page-head"><div class="icon"><i class="bi bi-ui-checks"></i></div>
    <div><div class="eyebrow">INPUTS</div><h1>Forms</h1><p>All form controls with live validation.</p></div>
  </div>
  <div class="row g-3">
    <div class="col-lg-8"><div class="card-x">
      <div class="section-title mb-3"><i class="bi bi-input-cursor-text"></i>Contact Form</div>
      <form id="cf" class="row g-3 needs-validation" novalidate>
        <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">Country</label><select class="form-select" required><option value="">Choose…</option><option>United States</option><option>Bangladesh</option><option>United Kingdom</option><option>Germany</option></select></div>
        <div class="col-md-6"><label class="form-label">Website</label><input type="url" class="form-control" placeholder="https://"></div>
        <div class="col-12"><label class="form-label">Message</label><textarea rows="4" class="form-control" required></textarea></div>
        <div class="col-12"><div class="form-check"><input required id="tos" class="form-check-input" type="checkbox"><label class="form-check-label" for="tos">Accept terms</label></div></div>
        <div class="col-12"><button class="btn btn-primary">Submit</button></div>
      </form>
      <div id="fok" class="alert alert-success mt-3 d-none">Submitted!</div>
    </div></div>
    <div class="col-lg-4"><div class="card-x">
      <div class="section-title mb-3"><i class="bi bi-toggles"></i>Controls</div>
      <label class="form-label">Range</label><input type="range" class="form-range" id="rng"><div class="small text-muted" id="rv">50</div>
      <label class="form-label mt-3">Switches</label>
      <div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">Email updates</label></div>
      <div class="form-check form-switch"><input class="form-check-input" type="checkbox"><label class="form-check-label">SMS alerts</label></div>
      <label class="form-label mt-3">File upload</label><input type="file" class="form-control">
    </div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
<script>renderLayout('forms.html');
const f=document.getElementById('cf');
f.addEventListener('submit',e=>{e.preventDefault();e.stopPropagation();if(f.checkValidity()){document.getElementById('fok').classList.remove('d-none');f.reset();f.classList.remove('was-validated');}else f.classList.add('was-validated');});
rng.oninput=()=>rv.textContent=rng.value;
</script></body></html>

<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charts • adminHMD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="page">
  <div class="page-head"><div class="icon"><i class="bi bi-bar-chart"></i></div>
    <div><div class="eyebrow">ANALYTICS</div><h1>Charts</h1><p>Visualize revenue, growth and category distribution.</p></div>
  </div>
  <div class="row g-3">
    <div class="col-lg-6"><div class="card-x"><div class="section-title mb-2"><i class="bi bi-graph-up"></i>Revenue Trend</div><canvas id="c1" height="140"></canvas></div></div>
    <div class="col-lg-6"><div class="card-x"><div class="section-title mb-2"><i class="bi bi-bar-chart"></i>Orders by Month</div><canvas id="c2" height="140"></canvas></div></div>
    <div class="col-lg-6"><div class="card-x"><div class="section-title mb-2"><i class="bi bi-pie-chart"></i>Category Split</div><canvas id="c3" height="140"></canvas></div></div>
    <div class="col-lg-6"><div class="card-x"><div class="section-title mb-2"><i class="bi bi-activity"></i>Traffic Sources</div><canvas id="c4" height="140"></canvas></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/layout.js"></script>
<script>renderLayout('charts.html');
const m=['Jan','Feb','Mar','Apr','May','Jun','Jul'];
new Chart(c1,{type:'line',data:{labels:m,datasets:[{label:'Revenue',data:[12,19,15,25,22,30,28],borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.15)',fill:true,tension:.4}]}});
new Chart(c2,{type:'bar',data:{labels:m,datasets:[{label:'Orders',data:[80,120,95,160,140,180,200],backgroundColor:'#0d9488',borderRadius:8}]}});
new Chart(c3,{type:'doughnut',data:{labels:['Apparel','Electronics','Home','Beauty'],datasets:[{data:[40,25,20,15],backgroundColor:['#2563eb','#0d9488','#eab308','#dc2626']}]}});
new Chart(c4,{type:'radar',data:{labels:['Direct','Search','Social','Email','Referral','Ads'],datasets:[{label:'Visits',data:[65,80,55,70,60,75],borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.2)'}]}});
</script></body></html>

<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add User • adminHMD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="page">
  <div class="page-head">
    <div class="icon"><i class="bi bi-person-plus"></i></div>
    <div><div class="eyebrow">CREATE</div><h1>Add User</h1><p>Invite a new teammate and set their access level.</p></div>
  </div>
  <div class="card-x">
    <form id="addForm" class="row g-3" novalidate>
      <div class="col-md-6"><label class="form-label">Full name</label><input required class="form-control" name="name" placeholder="Jane Doe"></div>
      <div class="col-md-6"><label class="form-label">Email</label><input required type="email" class="form-control" name="email" placeholder="jane@example.com"></div>
      <div class="col-md-4"><label class="form-label">Role</label><select class="form-select" name="role"><option>Admin</option><option>Manager</option><option>Editor</option><option>Viewer</option><option>Analyst</option></select></div>
      <div class="col-md-4"><label class="form-label">Team</label><select class="form-select" name="team"><option>Operations</option><option>Sales</option><option>Content</option><option>Finance</option><option>Data</option></select></div>
      <div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status"><option>Active</option><option>Pending</option><option>Suspended</option></select></div>
      <div class="col-md-6"><label class="form-label">Password</label><input required type="password" class="form-control" name="pwd" placeholder="At least 8 characters"></div>
      <div class="col-md-6"><label class="form-label">Confirm password</label><input required type="password" class="form-control" name="pwd2"></div>
      <div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" id="notify" checked><label class="form-check-label" for="notify">Send invite email</label></div>
      <div class="col-12 d-flex gap-2 justify-content-end"><button type="reset" class="btn btn-light border">Reset</button><button type="submit" class="btn btn-primary">Create User</button></div>
    </form>
    <div id="ok" class="alert alert-success mt-3 d-none"><i class="bi bi-check-circle me-1"></i>User created successfully.</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/layout.js"></script>
<script>renderLayout('add-user.html');
document.getElementById('addForm').addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.pwd.value!==f.pwd2.value){alert('Passwords do not match');return;}
  const d=new FormData(f);
  USERS.unshift({initials:d.get('name').split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase(),name:d.get('name'),email:d.get('email'),role:d.get('role'),team:d.get('team'),status:d.get('status'),joined:new Date().toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'})});
  document.getElementById('ok').classList.remove('d-none');f.reset();
  setTimeout(()=>location.href='users.html',900);
});
</script></body></html>

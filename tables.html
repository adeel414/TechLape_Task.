<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tables • adminHMD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="page">
  <div class="page-head"><div class="icon"><i class="bi bi-table"></i></div>
    <div><div class="eyebrow">DATA</div><h1>Tables</h1><p>Searchable, sortable, paginated data table.</p></div>
  </div>
  <div class="card-x">
    <div class="d-flex justify-content-between mb-2 gap-2 flex-wrap"><input id="q" class="form-control" style="max-width:280px" placeholder="Search…">
      <select id="ps" class="form-select" style="max-width:110px"><option>5</option><option>10</option><option>20</option></select>
    </div>
    <div class="table-responsive"><table class="table align-middle" id="tbl">
      <thead><tr><th data-k="name" class="sort">Name</th><th data-k="role" class="sort">Role</th><th data-k="team" class="sort">Team</th><th data-k="status" class="sort">Status</th><th data-k="joined" class="sort">Joined</th></tr></thead><tbody></tbody></table></div>
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><div id="info" class="small text-muted"></div><nav><ul class="pagination pagination-sm mb-0" id="pg"></ul></nav></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/layout.js"></script>
<script>renderLayout('tables.html');
let page=1,size=5,sort={k:null,d:1},q='';
function view(){
  let l=USERS.filter(u=>!q||u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)||u.role.toLowerCase().includes(q));
  if(sort.k) l=l.slice().sort((a,b)=>a[sort.k]>b[sort.k]?sort.d:-sort.d);
  const total=l.length,pages=Math.max(1,Math.ceil(total/size));if(page>pages)page=pages;
  const start=(page-1)*size,rows=l.slice(start,start+size);
  document.querySelector('#tbl tbody').innerHTML=rows.map(u=>`<tr><td><b>${u.name}</b><div class="small text-muted">${u.email}</div></td><td>${u.role}</td><td>${u.team}</td><td><span class="status ${u.status.toLowerCase()}">${u.status}</span></td><td>${u.joined}</td></tr>`).join('');
  document.getElementById('info').textContent=`Showing ${rows.length?start+1:0}–${start+rows.length} of ${total}`;
  let pg='';for(let i=1;i<=pages;i++)pg+=`<li class="page-item ${i===page?'active':''}"><a class="page-link" href="#" data-p="${i}">${i}</a></li>`;
  document.getElementById('pg').innerHTML=pg;
  document.querySelectorAll('#pg a').forEach(a=>a.onclick=e=>{e.preventDefault();page=+a.dataset.p;view();});
}
document.querySelectorAll('.sort').forEach(th=>th.style.cursor='pointer');
document.querySelectorAll('.sort').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sort.d=(sort.k===k?-sort.d:1);sort.k=k;view();});
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();page=1;view();};
document.getElementById('ps').onchange=e=>{size=+e.target.value;view();};
view();
</script></body></html>

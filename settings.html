<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings • adminHMD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="page">
  <div class="page-head"><div class="icon"><i class="bi bi-gear"></i></div>
    <div><div class="eyebrow">PREFERENCES</div><h1>Settings</h1><p>Personalize your workspace.</p></div>
  </div>
  <div class="row g-3">
    <div class="col-lg-6"><div class="card-x"><h6 class="section-title mb-3"><i class="bi bi-palette"></i>Appearance</h6>
      <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="dm"><label class="form-check-label" for="dm">Dark mode</label></div>
      <label class="form-label">Accent</label>
      <div class="d-flex gap-2">
        <button class="btn" style="background:#2563eb;width:32px;height:32px;border-radius:50%"></button>
        <button class="btn" style="background:#0d9488;width:32px;height:32px;border-radius:50%"></button>
        <button class="btn" style="background:#dc2626;width:32px;height:32px;border-radius:50%"></button>
        <button class="btn" style="background:#eab308;width:32px;height:32px;border-radius:50%"></button>
      </div>
    </div></div>
    <div class="col-lg-6"><div class="card-x"><h6 class="section-title mb-3"><i class="bi bi-bell"></i>Notifications</h6>
      <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">Email digest</label></div>
      <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">SMS alerts</label></div>
      <div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">In-app push</label></div>
    </div></div>
    <div class="col-lg-12"><div class="card-x"><h6 class="section-title mb-3"><i class="bi bi-shield-lock"></i>Security</h6>
      <form class="row g-3" onsubmit="event.preventDefault();alert('Password updated')">
        <div class="col-md-4"><label class="form-label">Current</label><input type="password" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">New</label><input type="password" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Confirm</label><input type="password" class="form-control" required></div>
        <div class="col-12 text-end"><button class="btn btn-primary">Update Password</button></div>
      </form>
    </div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
<script>renderLayout('settings.html');
const dm=document.getElementById('dm');dm.checked=document.documentElement.classList.contains('dark');
dm.onchange=()=>{document.documentElement.classList.toggle('dark',dm.checked);localStorage.setItem('theme',dm.checked?'dark':'light');};
</script></body></html>

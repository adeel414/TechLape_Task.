<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Users • adminHMD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="page">
  <div class="page-head">
    <div class="icon"><i class="bi bi-people"></i></div>
    <div><div class="eyebrow">MANAGE</div><h1>Users</h1><p>Search, filter and manage every user in the workspace.</p></div>
    <div class="actions">
      <a href="add-user.html" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Add User</a>
    </div>
  </div>
  <div class="card-x">
    <div class="row g-2 mb-3">
      <div class="col-md-6"><input id="q" type="text" class="form-control" placeholder="Search by name or email…"></div>
      <div class="col-md-3"><select id="fRole" class="form-select"><option value="">All Roles</option><option>Admin</option><option>Manager</option><option>Editor</option><option>Viewer</option><option>Analyst</option></select></div>
      <div class="col-md-3"><select id="fStatus" class="form-select"><option value="">All Status</option><option>Active</option><option>Pending</option><option>Suspended</option><option>Inactive</option></select></div>
    </div>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>USER</th><th>ROLE</th><th>TEAM</th><th>STATUS</th><th>JOINED</th><th class="text-end">ACTIONS</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="small text-muted" id="count"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/layout.js"></script>
<script>
renderLayout('users.html');
const tbody=document.getElementById('tbody');const count=document.getElementById('count');
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const r=document.getElementById('fRole').value;
  const s=document.getElementById('fStatus').value;
  const list=USERS.filter(u=>(!q||u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q))&&(!r||u.role===r)&&(!s||u.status===s));
  tbody.innerHTML=list.map(u=>`<tr>
    <td><div class="d-flex align-items-center gap-2"><div class="avatar" style="width:36px;height:36px;font-size:12px;background:#e0e7ff;color:#3730a3">${u.initials}</div><div><div class="fw-semibold">${u.name}</div><div class="small text-muted">${u.email}</div></div></div></td>
    <td>${u.role}</td><td>${u.team}</td><td><span class="status ${u.status.toLowerCase()}">${u.status}</span></td><td>${u.joined}</td>
    <td class="text-end"><button class="btn btn-sm btn-light border me-1"><i class="bi bi-eye"></i></button><button class="btn btn-sm btn-light border me-1"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-light border text-danger" onclick="del('${u.email}')"><i class="bi bi-trash"></i></button></td>
  </tr>`).join('');
  count.textContent=`Showing ${list.length} of ${USERS.length} users`;
}
function del(email){const i=USERS.findIndex(u=>u.email===email);if(i>-1&&confirm('Delete user?')){USERS.splice(i,1);render();}}
['q','fRole','fStatus'].forEach(id=>document.getElementById(id).addEventListener('input',render));
render();
</script></body></html>

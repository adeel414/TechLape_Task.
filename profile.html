<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile • adminHMD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="page">
  <div class="page-head">
    <div class="icon"><i class="bi bi-person-badge"></i></div>
    <div><div class="eyebrow">ACCOUNT</div><h1>Profile</h1><p>Personal details and workspace preferences.</p></div>
  </div>
  <div class="row g-3">
    <div class="col-lg-4">
      <div class="card-x text-center">
        <div class="avatar mx-auto mb-2" style="width:96px;height:96px;font-size:28px">AV</div>
        <h5 class="mb-0">Admin Hasan</h5><div class="text-muted small">admin@adminhmd.com</div>
        <div class="d-flex justify-content-center gap-4 mt-3">
          <div><div class="fw-bold fs-5">248</div><div class="small text-muted">Projects</div></div>
          <div><div class="fw-bold fs-5">1.2k</div><div class="small text-muted">Followers</div></div>
          <div><div class="fw-bold fs-5">98%</div><div class="small text-muted">Rating</div></div>
        </div>
        <button class="btn btn-light border mt-3 w-100"><i class="bi bi-camera me-1"></i>Change photo</button>
      </div>
    </div>
    <div class="col-lg-8">
      <div class="card-x">
        <div class="section-title mb-3"><i class="bi bi-pencil-square"></i>Edit Profile</div>
        <form class="row g-3" onsubmit="event.preventDefault();document.getElementById('okp').classList.remove('d-none')">
          <div class="col-md-6"><label class="form-label">First name</label><input class="form-control" value="Admin"></div>
          <div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" value="Hasan"></div>
          <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" value="admin@adminhmd.com"></div>
          <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" value="+1 555 010 2288"></div>
          <div class="col-12"><label class="form-label">Bio</label><textarea class="form-control" rows="3">Building clean dashboards & shipping delightful tools.</textarea></div>
          <div class="col-12 text-end"><button class="btn btn-primary">Save Changes</button></div>
        </form>
        <div id="okp" class="alert alert-success mt-3 d-none">Profile updated.</div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script><script>renderLayout('profile.html');</script>
</body></html>
